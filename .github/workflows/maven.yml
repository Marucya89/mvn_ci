name: Java CI with Maven

on: [push, pill_request]

jobs:
  build:

  runs-on: ubuntu-latest

  steps:
  - uses: actions/chekout@v2
  - name: Set up JDK 11
    uses: action/setap-java@v2
    with:
      java-version: '11'
      distribution: 'adopt' 
  - name: Build with Maven
    run: mvn -B -e verifi
    
